<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Core Technical SEO Meta Parameters -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Premium Search Engine Ranking Elements -->
    <title>ARCREED EXIM HOUSE | The Future of Shipping & Logistics</title>
    <meta name="description" content="Welcome to Arcreed Exim House. Pioneering the future of global shipping, international trade management, and maritime supply chain logistics. Discover how business shapes global trade.">
    <meta name="keywords" content="Arcreed Exim House, shipping corporation, international trade, maritime cargo, freight forwarding, logistics, export import house">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Protocol (For Premium Social Media Sharing Preview) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ARCREED EXIM HOUSE | The Future of Shipping">
    <meta property="og:description" content="Discover premium international trade routing and logistics management infrastructure. Launching globally January 1, 2027.">
    <meta property="og:url" content="https://arceedeximhouse.com">
    <meta property="og:image" content="logo.png">

    <!-- Verified Google Search Console Mapping Hook Placeholder -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCREED EXIM HOUSE | The Future of Shipping</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        /* Modern Premium Corporate Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Times New Roman', Times, serif;
            color: #ffffff;
            background-color: #RRGGBBAA;
            overflow-x: hidden;
        }

        /* Continuous Loop Video Background Engine */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Dark High-Contrast Grading Overlay */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0.85));
            z-index: -1;
        }

        /* Content Framework Grid */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
        }

        /* Brand Identification Label */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
        }
        .logo {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 6px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Primary Content Section */
        .hero-section {
            max-width: 900px;
            margin: auto;
        }
        .main-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: normal;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.15;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }
        .subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.7rem);
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 300;
            letter-spacing: 1.5px;
            color: #e5e5e5;
            margin-bottom: 45px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Interactive Brand CTA Button */
        .cta-btn {
            display: inline-block;
            background-color: #fffde8;
            color: #0b0c10;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            padding: 16px 55px;
            border-radius: 30px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .cta-btn:hover {
            transform: translateY(-3px);
            background-color: #ffffff;
            box-shadow: 0 6px 20px rgba(255,255,255,0.3);
        }

        /* Corporate Details Dashboard Bar */
        .info-bar {
            width: 100%;
            max-width: 1100px;
            border-top: 1px solid rgba(255,255,255,0.25);
            border-bottom: 1px solid rgba(255,255,255,0.25);
            padding: 24px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .info-item {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .info-item span {
            color: #d1d1d1;
            font-weight: 300;
            margin-left: 6px;
        }

        /* Mobile Layout Optimizations */
        @media (max-width: 768px) {
            .info-bar {
                flex-direction: column;
                gap: 15px;
                padding: 25px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Target Loop Video Engine File Link -->
    <video autoplay loop muted playsinline webkit-playsinline id="bg-video">
        <source src="backgroundvideo.mp4" type="video/mp4">
    </video>
    
    <!-- Dark Grading Contrast Overlay -->
    <div class="video-overlay"></div>

    <!-- Interface Structure Wrapper -->
    <div class="container">
        
        <header>
            <div class="logo">ARCREED EXIM HOUSE</div>
        </header>

        <main class="hero-section">
            <h1 class="main-title">The Future<br>Of Shipping:</h1>
            <p class="subtitle">How Business Will Shape Trade</p>
            <a href="mailto:info@arcreedeximhouse.com" class="cta-btn">Learn More</a>
        </main>

        <section class="info-bar">
            <div class="info-item">📅 Launching: <span>January 1, 2027</span></div>
            <div class="info-item">⏰ Time: <span>12:00 PM EST</span></div>
            <div class="info-item">🌐 Domain: <span>ARCREEDEXIMHOUSE.COM</span></div>
        </section>

    </div>

</body>
</html>
