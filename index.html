<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCREED EXIM HOUSE | The Future of Shipping</title>
    <style>
        /* Professional Premium Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Times New Roman', Times, serif;
            color: #ffffff;
            -color: #0b0c10;
            overflow-x: hidden;
        }

        /* Seamless Loop Video  */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.7; /* Adds clean contrast for text readability */
        }

        /* Gradient Dark Overlay Layer */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            : linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.75));
            z-index: -1;
        }

        /* Main Structural Frame */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 50px 20px;
        }

        /* Sovereign Brand Header */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
        }
        .logo {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* Core Presentation Copy */
        .hero-section {
            max-width: 850px;
            margin: auto;
        }
        .main-title {
            font-size: clamp(2.3rem, 5.5vw, 4.2rem);
            font-weight: normal;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.15;
            margin-bottom: 20px;
        }
        .subtitle {
            font-size: clamp(1.1rem, 2.2vw, 1.6rem);
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 300;
            letter-spacing: 1px;
            color: #e0e0e0;
            margin-bottom: 45px;
        }

        /* Interactive Call-To-Action */
        .cta-btn {
            display: inline-block;
            -color: #fffde8;
            color: #0b0c10;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            padding: 16px 50px;
            border-radius: 30px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .cta-btn:hover {
            transform: translateY(-2px);
            -color: #ffffff;
            box-shadow: 0 6px 20px rgba(255,255,255,0.25);
        }

        /* Corporate Launch Details Bar */
        .info-bar {
            width: 100%;
            max-width: 1000px;
            border-top: 1px solid rgba(255,255,255,0.25);
            border-bottom: 1px solid rgba(255,255,255,0.25);
            padding: 22px 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            : rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .info-item {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .info-item span {
            color: #cccccc;
            font-weight: 300;
            margin-left: 4px;
        }

        /* Responsive Mobile Layout Adjustments */
        @media (max-width: 768px) {
            .info-bar {
                flex-direction: column;
                gap: 15px;
                padding: 25px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Professional Core Loop  Video -->
    <video autoplay loop muted playsinline id="bg-video">
        <source src="backgroundvideo.mp4" type="video/mp4">
    </video>
    
    <!-- Protective Visual Overlay -->
    <div class="video-overlay"></div>

    <!-- Complete Layout Container -->
    <div class="container">
        
        <!-- Top Brand Label -->
        <header>
            <div class="logo">ARCREED EXIM HOUSE</div>
        </header>

        <!-- Main Display Text -->
        <main class="hero-section">
            <h1 class="main-title">The Future<br>Of Shipping:</h1>
            <p class="subtitle">How Business Will Shape Trade</p>
            <a href="mailto:info@arcreedeximhouse.com" class="cta-btn">Learn More</a>
        </main>

        <!-- Bottom Corporate Scheduling Footer -->
        <section class="info-bar">
            <div class="info-item">📅 Launching: <span>January 1, 2027</span></div>
            <div class="info-item">⏰ Time: <span>12:00 PM EST</span></div>
            <div class="info-item">🌐 Domain: <span>ARCREEDEXIMHOUSE.COM</span></div>
        </section>

    </div>

</body>
</html>
